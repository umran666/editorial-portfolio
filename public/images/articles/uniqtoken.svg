<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UniqToken tokenizer architecture cover</title>
  <desc id="desc">A monochrome tokenizer research diagram showing script-aware and byte-fallback stages.</desc>
  <defs>
    <pattern id="diagonal" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <path d="M0 0H18" stroke="#25282b" stroke-width="2" opacity=".42"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0c0e"/>
      <stop offset="1" stop-color="#171a1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <rect width="1200" height="630" fill="url(#diagonal)"/>
  <g fill="none" stroke="#f2f0eb" stroke-width="3" opacity=".95">
    <path d="M62 118 96 94l34 24v40l-34 24-34-24z"/>
    <path d="m62 118 34 24 34-24M96 142v40M78 105v40l34 24M112 105v40l-34 24"/>
  </g>
  <text x="1138" y="114" text-anchor="end" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="2">UNIQTOKEN</text>
  <text x="1138" y="146" text-anchor="end" fill="#878b8d" font-family="monospace" font-size="12" letter-spacing="3">TOKENIZER RESEARCH TOOLKIT</text>
  <g transform="translate(82 270)">
    <text fill="#f2f0eb" font-family="Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="1">SCRIPT-AWARE  •  BYTE-FALLBACK</text>
    <text y="76" fill="#f2f0eb" font-family="Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="1">BPE / UNIGRAM / SUPERBPE</text>
  </g>
  <g transform="translate(82 520)" fill="#9ba0a3" font-family="monospace" font-size="14" letter-spacing="2">
    <text>UNICODE INPUT</text><text x="220">→</text><text x="270">SUBWORD MERGES</text><text x="535">→</text><text x="585">TOKEN IDS</text>
  </g>
  <path d="M82 558H1118" stroke="#565b5e"/>
  <text x="1118" y="592" text-anchor="end" fill="#757b7e" font-family="monospace" font-size="12" letter-spacing="2">INSIDE UNIQTOKEN // 01</text>
</svg>
